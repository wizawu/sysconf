- name: install desktop
  apt:
    name:
      - awesome
      - awesome-extra
      - code
      - cpupower-gui
      - dbus-x11
      - evince
      - flameshot
      - fontforge
      - geany # text editor
      - geany-plugin-vimode
      - gimp
      - libappindicator3-1
      - lxappearance
      - meld
      - mirage # image viewer
      - mupdf
      - network-manager-applet
      - pavucontrol
      - picom # fix chrome menu border
      - qt5ct
      - redshift
      - smplayer
      - sqlitebrowser
      - tilix
      - vim-gtk3 # needed by "+ command
      - virtualbox
      - virtualbox-qt
      - wireshark
      - x11-xkb-utils
      - x11-xserver-utils
      - xdg-desktop-portal
      - xdg-user-dirs
      - xinput
      - xorg
      - xsel
      - xserver-xorg-input-all
      - xserver-xorg-input-kbd
      - xserver-xorg-input-synaptics
      - xtrlock

- name: install input method
  apt:
    name:
      - fcitx-config-gtk
      - fcitx-frontend-gtk3
      - fcitx-frontend-qt5 # needed by flameshot
      - fcitx-googlepinyin
      - fcitx-module-x11

- name: install packages from url
  apt: deb={{item}}
  with_items:
    - https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

- name: install mate desktop
  apt:
    install_recommends: true
    name:
      - mate-control-center
      - mate-panel
      - mate-session-manager

- name: create awesome config directory
  file:
    path: /home/{{user}}/.config/awesome
    state: directory
    owner: "{{user}}"
    group: "{{user}}"
    mode: "0755"

- name: copy lain to awesome config
  copy:
    src: usr/share/awesome/lib/lain/
    dest: /home/{{user}}/.config/awesome/lain/
    owner: "{{user}}"
    group: "{{user}}"

- name: copy awesome layout icon
  copy:
    src: usr/share/awesome/lib/lain/icons/layout/default/centerfairw.png
    dest: /usr/share/awesome/themes/default/layouts/centerfairw.png
    owner: root
    group: root
    mode: "0644"

- name: configure awesome centerfair layout icon
  lineinfile:
    path: /usr/share/awesome/themes/default/theme.lua
    insertbefore: '^return theme'
    line: 'theme.layout_centerfair = themes_path.."default/layouts/centerfairw.png"'
